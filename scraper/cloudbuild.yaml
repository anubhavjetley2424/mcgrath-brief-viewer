# Cloud Build config — builds the brief-scraper image from the project root
# using scraper/Dockerfile. Substitution variable _IMAGE is set by deploy.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - scraper/Dockerfile
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
